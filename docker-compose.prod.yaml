services:
  web:
    image: ${IMAGE}
    container_name: web-culture
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - local
      - web-public
      - obs_network
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.prod
      - OTEL_SERVICE_NAME=web-culture
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    command: [
      "uv", "run", "--no-sync", "gunicorn",
      "--bind=0.0.0.0:8000",
      "--workers=4",
      "--max-requests=1000",
      "--max-requests-jitter=50",
      "config.wsgi:application"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17.3-alpine
    container_name: db-culture
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5G
    logging: *default-logging

  redis:
    image: redis:8.2-alpine
    container_name: redis-culture
    restart: unless-stopped
    networks:
      - local
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  celery:
    image: ${IMAGE}
    container_name: celery-culture
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - local
      - web-public
      - obs_network
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.prod
      - OTEL_SERVICE_NAME=web-culture
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    command: [
      "uv", "run", "--no-sync", "celery",
      "-A", "config", "worker",
      "--concurrency=4",
      "--loglevel=info",
      "--hostname=worker@%h",
      "--prefetch-multiplier=1"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  celery_beat:
    image: ${IMAGE}
    container_name: celery_beat-culture
    restart: unless-stopped
    networks:
      - local
    env_file:
      - .env
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    command: [
      "uv", "run", "--no-sync", "celery",
      "-A", "config", "beat",
      "--loglevel=info"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  nginx:
    image: nginx:1.29-alpine
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
#      - "443:443"
    networks:
      - web-public
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

networks:
  local:
    name: local
    driver: bridge
    internal: true
  web-public:
    name: web-public
    driver: bridge
  obs_network:
    external: true

volumes:
  redis_data:
  postgres_data:
