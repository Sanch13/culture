services:
  web:
    image: ${IMAGE}
    container_name: web-culture
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    command: "uv run --no-sync gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - local
      - web-public

  db:
    image: postgres:17.3-alpine
    container_name: db-culture
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - local

  redis:
    image: redis:8.2-alpine
    container_name: redis-culture
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - local

  celery:
    image: ${IMAGE}
    container_name: celery-culture
    command: uv run --no-sync celery -A config worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - local
      - web-public

  celery_beat:
    image: ${IMAGE}
    container_name: celery_beat-culture
    command: uv run --no-sync celery -A config beat --loglevel=info
    env_file:
      - .env
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - local

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
#      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static:ro
      - ./media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - web-public

networks:
  local:
    name: local
    driver: bridge
    internal: true
  web-public:
    name: web-public
    driver: bridge

volumes:
  redis_data:
  postgres_data:
