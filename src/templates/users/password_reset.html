<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сброс пароля</title>
    {% include 'snippets/favicon.html' %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Подключаем собственные стили  -->
    <link href="{% static 'css/main.css' %}" rel="stylesheet"/>

    <style>body { background: #f5f5f5; display: flex; align-items: center; height: 100vh; }</style>
</head>
<body>
<main class="container" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-center mb-3">Забыли пароль?</h3>
        <p class="text-muted small text-center">Введите email, указанный при регистрации. Мы отправим туда инструкцию.</p>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <input type="email" name="{{ field.name }}" class="form-control" placeholder="e-mail" required id="{{ field.id_for_label }}">
                    {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
                </div>
            {% endfor %}
            <button class="w-100 btn btn-primary" type="submit">Сбросить пароль</button>
        </form>
    </div>
</main>
</body>
</html>
