<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Подключаем собственные стили  -->
    <link href="{% static 'css/main.css' %}" rel="stylesheet"/>

    <style>
        body { background-color: #f5f5f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .form-signin { width: 100%; max-width: 400px; padding: 15px; margin: auto; }
        .card { border: none; shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<main class="form-signin">
    <div class="card p-4">
        <div class="d-flex align-items-center justify-content-center mb-4 gap-3">
            <!-- Логотип -->
            <!-- src указывает на файл в папке static/img/ -->
            <!-- class="logo-img" нужен для удобной настройки размера в CSS -->
            <img src="{% static 'img/logo-green.png' %}" alt="Логотип" class="logo-img">

            <!-- Текст (Заголовок и подзаголовок) -->
            <div class="text-start"> <!-- Текст выравниваем по левому краю внутри блока -->
                <h1 class="h3 mb-1 fw-normal">Культура производства</h1>
                <p class="text-muted mb-0">Введите данные для входа</p>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}

            <!-- Вывод ошибок (например, неверный пароль) -->
            {% if form.errors %}
                <div class="alert alert-danger">
                    Неверный email или пароль.
                </div>
            {% endif %}

            <!-- Поля формы -->
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    <!-- Добавляем класс form-control для красоты Bootstrap -->
                    {{ field }}
                </div>
            {% endfor %}

            <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">Войти</button>

            <div class="mt-3 text-center">
                <a href="{% url 'users:register' %}">Нет аккаунта? Зарегистрироваться</a>
                <br>
                <a href="{% url 'users:password_reset' %}" class="text-muted small">Забыли пароль?</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
