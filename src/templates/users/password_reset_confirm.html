<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый пароль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Подключаем собственные стили  -->
    <link href="{% static 'css/main.css' %}" rel="stylesheet"/>

    <style>body { background: #f5f5f5; display: flex; align-items: center; height: 100vh; }</style>
</head>
<body>
<main class="container" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-center mb-4">Новый пароль</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label small text-muted">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" class="form-control">
                    {% if field.help_text %}<div class="form-text small">{{ field.help_text|safe }}</div>{% endif %}
                    {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
                </div>
            {% endfor %}
            <button class="w-100 btn btn-primary" type="submit">Сохранить пароль</button>
        </form>
    </div>
</main>
</body>
</html>
