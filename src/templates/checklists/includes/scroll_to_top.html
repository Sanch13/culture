<!-- checklists/templates/checklists/includes/scroll_to_top.html -->

<!-- Кнопка (изначально скрыта) -->
<button id="scrollToTopBtn"
        class="btn btn-primary rounded-circle shadow"
        title="Наверх"
        onclick="scrollToTop()">
    <i class="bi bi-arrow-up-short" style="font-size: 2.5rem; line-height: 1;"></i>
</button>

<!-- Стили кнопки -->
<style>
    .scroll-to-top {
        display: none;
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: center;

        bottom: 50px;
        right: 65px;

        opacity: 0.8;
        transition: opacity 0.3s;
        width: 100px;
        height: 100px;

        background-color: #7F9A14;
        color: white;
        border: 2px solid #7F9A14;
        border-radius: 50%;
        /*font-size: 44px;*/
        cursor: pointer;
        z-index: 1000;
    }

    .scroll-to-top:active {
        border: 1px solid #7F9A14;
        background-color: #7F9A14;

    }
    .scroll-to-top:hover {
        border: 1px solid #7F9A14;
        background-color: #7F9A14;
    }


    #scrollToTopBtn {
        display: none; /* Скрыта по умолчанию */
        position: fixed; /* Фиксирована на экране */
        bottom: 50px; /* Отступ снизу (чуть выше твоего sticky-footer, если он есть) */
        right: 55px; /* Отступ справа */
        width: 75px;
        height: 75px;
        z-index: 1050; /* Поверх всего контента */
        opacity: 0.8;
        transition: opacity 0.3s;
        border: none;
        padding: 0;

        background-color: #7F9A14;
        color: white;
        border-radius: 50%;
        /* Центрируем иконку внутри круга */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #scrollToTopBtn:hover {
        opacity: 1;
        background-color: #586b0f;
    }
</style>

<!-- Логика кнопки -->
<script>
    // Получаем кнопку
    const scrollToTopBtn = document.getElementById("scrollToTopBtn");

    // Отслеживаем скролл
    window.addEventListener("scroll", function() {
        // Если прокрутили больше 300px вниз - показываем
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            // Используем d-flex, чтобы кнопка появилась и иконка осталась по центру
            scrollToTopBtn.style.setProperty('display', 'flex', 'important');
        } else {
            // Иначе прячем
            scrollToTopBtn.style.setProperty('display', 'none', 'important');
        }
    });

    // Функция прокрутки наверх
    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: "smooth" /* Плавная прокрутка */
        });
    }
</script>
