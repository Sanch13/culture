<!-- checklists/templates/checklists/includes/scroll_to_top.html -->

<!-- Кнопка (изначально скрыта) -->
<button id="scrollToTopBtn"
        class="btn btn-primary rounded-circle shadow"
        title="Наверх"
        onclick="scrollToTop()">
    <i class="bi bi-arrow-up-short" style="font-size: 2.5rem; line-height: 1;"></i>
</button>

<!-- Стили кнопки -->
<style>
    #scrollToTopBtn {
        display: none; /* Скрыта по умолчанию (JS её покажет) */
        position: fixed; /* Прибита к экрану */
        z-index: 1050; /* Поверх таблиц и модалок */

        /* Внешний вид (твои цвета) */
        background-color: #7F9A14 !important;
        color: white !important;
        border: none;
        border-radius: 50% !important; /* Круг */
        opacity: 0.8;
        transition: all 0.3s ease; /* Плавное наведение */

        /* Выравнивание иконки */
        padding: 0;
        align-items: center;
        justify-content: center;

        /* ДЕСКТОПНЫЕ РАЗМЕРЫ (По умолчанию) */
        bottom: 75px;
        right: 200px;
        width: 65px;
        height: 65px;
    }

    /* Десктопная иконка (Большая) */
    #scrollToTopBtn i {
        font-size: 2.5rem;
        line-height: 1;
    }

    #scrollToTopBtn:hover {
        opacity: 1;
        background-color: #586b0f !important;
        transform: translateY(-3px); /* Чуть приподнимается при наведении */
    }

    /* ==================================================== */
    /* АДАПТИВНОСТЬ ДЛЯ ПЛАНШЕТОВ (Экраны меньше 992px)     */
    /* ==================================================== */
    @media (max-width: 991px) {
        #scrollToTopBtn {
            bottom: 75px;
            right: 15px;
            width: 50px;
            height: 50px;
        }
        #scrollToTopBtn i {
            font-size: 2rem;
        }
    }

    /* ==================================================== */
    /* АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ (Экраны меньше 576px)     */
    /* ==================================================== */
    @media (max-width: 575px) {
        #scrollToTopBtn {
            /* Поднимаем выше, если на мобиле есть "плавающий футер" */
            bottom: 75px;
            /* Прижимаем ближе к правому краю */
            right: 10px;
            /* Делаем компактнее, чтобы не мешала читать */
            width: 40px;
            height: 40px;
        }
        #scrollToTopBtn i {
            font-size: 1.8rem;
        }
    }
</style>


<!-- Логика кнопки -->
<script>
    // Получаем кнопку
    const scrollToTopBtn = document.getElementById("scrollToTopBtn");

    // Отслеживаем скролл
    window.addEventListener("scroll", function() {
        // Если прокрутили больше 300px вниз - показываем
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            // Используем d-flex, чтобы кнопка появилась и иконка осталась по центру
            scrollToTopBtn.style.setProperty('display', 'flex', 'important');
        } else {
            // Иначе прячем
            scrollToTopBtn.style.setProperty('display', 'none', 'important');
        }
    });

    // Функция прокрутки наверх
    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: "smooth" /* Плавная прокрутка */
        });
    }
</script>
