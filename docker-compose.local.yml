services:
  web:
    image: culture
    build:
      context: .
      dockerfile: Dockerfile-Local
    container_name: web
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - local
      - obs_network
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.prod
      - OTEL_SERVICE_NAME=web
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./fixtures:/app/fixtures
      - ./media:/app/media
      - ./manage.py:/app/manage.py
    command: [
      "uv",
      "run",
      "gunicorn",
      "--bind",
      "0.0.0.0:8000",
      "config.wsgi:application"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17.3-alpine
    container_name: db
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "5433:5432"
    networks:
      - local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5G
    logging: *default-logging

  redis:
    image: redis:8.2-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - local
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  celery:
    image: culture
    container_name: celery
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - local
      - obs_network
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.prod
      - OTEL_SERVICE_NAME=celery
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    command: [
      "uv", "run", "celery",
      "-A","config",
      "worker",
      "--loglevel=info"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging: *default-logging

  celery_beat:
    image: culture
    container_name: celery_beat
    restart: unless-stopped
    networks:
      - local
    env_file:
      - .env
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    command: [
      "uv", "run", "celery",
      "-A", "config", "beat",
      "--loglevel=info"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging


  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - local
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static/
      - ./media:/app/media/
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

networks:
  local:
    driver: bridge
  obs_network:
    external: true

volumes:
  redis_data:
  postgres_data:
