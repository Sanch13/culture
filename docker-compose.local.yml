services:
  web:
    image: culture
    build:
      context: .
      dockerfile: Dockerfile-Local
    container_name: web
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./fixtures:/app/fixtures
      - ./media:/app/media
      - ./manage.py:/app/manage.py
    command: [
      "uv",
      "run",
      "gunicorn",
      "--bind",
      "0.0.0.0:8000",
      "config.wsgi:application"
    ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.prod
      - OTEL_SERVICE_NAME=web
    restart: unless-stopped
    networks:
      - local
      - obs_network

  db:
    image: postgres:17.3-alpine
    container_name: db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - local

  celery:
    image: culture
    container_name: celery
    command: [
      "uv",
      "run",
      "celery",
      "-A",
      "config",
      "worker",
      "--loglevel=info"
    ]
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.prod
      - OTEL_SERVICE_NAME=celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - local
      - obs_network

  celery_beat:
    image: culture
    container_name: celery_beat
    command: [
      "uv",
      "run",
      "celery",
      "-A",
      "config",
      "beat",
      "--loglevel=info"
    ]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - local

  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static/
      - ./media:/app/media/
    restart: unless-stopped
    networks:
      - local

networks:
  local:
    driver: bridge
  obs_network:
    external: true

volumes:
  redis_data:
  postgres_data:
