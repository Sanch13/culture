services:
  loki:
    image: grafana/loki:3.6.10
    container_name: obs-loki
    user: "0:0"
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - obs_network
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml
      - loki_data:/tmp/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    deploy:
      resources:
        limits:
          memory: 800M

  promtail:
    image: grafana/promtail:3.6.10
    container_name: obs-promtail
    restart: unless-stopped
    networks:
      - obs_network
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail/config.yaml:/etc/promtail/config.yaml
      - promtail_data:/tmp
    command: ["-config.file=/etc/promtail/config.yaml"]
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.6.9
    container_name: obs-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - obs_network
#    environment:
#      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - victoriametrics
      - tempo
    deploy:
      resources:
        limits:
          memory: 512M

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.139.0
    container_name: obs-victoriametrics
    restart: unless-stopped
    stop_grace_period: 1m
    networks:
      - obs_network
    volumes:
      - vm_data:/victoria-metrics-data
      - ./observability/victoriametrics/prometheus.yaml:/etc/prometheus/prometheus.yaml
    command: [
      "-promscrape.config=/etc/prometheus/prometheus.yaml",
      "-retentionPeriod=1y"
    ]
    deploy:
      resources:
        limits:
          memory: 512M

  tempo:
    image: grafana/tempo:2.10.3
    container_name: obs-tempo
    restart: unless-stopped
    stop_grace_period: 1m
    user: "0:0"
    networks:
      - obs_network
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    deploy:
      resources:
        limits:
          memory: 800M

networks:
  obs_network:
    name: obs_network
    driver: bridge

volumes:
  loki_data:
  promtail_data:
  grafana_data:
  vm_data:
  tempo_data:
